services:
  db:
    image: postgis/postgis:16-3.4
    container_name: climatex_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-climatex}
      POSTGRES_USER: ${POSTGRES_USER:-climatex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-climatex_pass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - climatex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-climatex_user} -d ${POSTGRES_DB:-climatex}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - climatex_net

volumes:
  climatex_pgdata:
    driver: local

networks:
  climatex_net:
    driver: bridge
